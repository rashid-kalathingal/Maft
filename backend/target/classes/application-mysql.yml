# MySQL profile: SPRING_PROFILES_ACTIVE=mysql
# Provide DB_URL / DB_USERNAME / DB_PASSWORD via environment variables.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/maft?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  h2:
    console:
      enabled: false
