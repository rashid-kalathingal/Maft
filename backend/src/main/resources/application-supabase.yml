# Supabase PostgreSQL profile: SPRING_PROFILES_ACTIVE=supabase
# Provide DB_URL / DB_USERNAME / DB_PASSWORD via environment variables.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:5432/postgres}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres.phrkdfhccivjpogbrdom}
    password: ${DB_PASSWORD:}
    hikari:
      # Supabase free-tier session-mode pooler caps TOTAL clients at 15.
      # Render keeps the OLD instance running while the NEW one boots during a
      # deploy, so two instances must fit under 15. Keep each instance small.
      maximum-pool-size: ${DB_POOL_SIZE:4}
      minimum-idle: 1
      connection-timeout: 30000
      # Recycle connections well before Supabase drops idle ones.
      max-lifetime: 1800000
      idle-timeout: 300000
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    properties:
      hibernate:
        # Batch-load the EAGER @ElementCollections (variants/specs/images) with
        # IN-clauses instead of one query per product — avoids N+1 over the
        # remote Supabase pooler that made GET /api/products time out.
        default_batch_fetch_size: 100
  h2:
    console:
      enabled: false

# Supabase Storage Configuration
supabase:
  url: ${SUPABASE_URL:https://phrkdfhccivjpogbrdom.supabase.co}
  key: ${SUPABASE_ANON_KEY:}
  storage-bucket: ${SUPABASE_STORAGE_BUCKET:MAFT}
